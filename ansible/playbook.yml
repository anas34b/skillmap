---
- name: Configure SkillMap Cloud Run (post-déploiement)
  hosts: localhost
  connection: local
  vars:
    project: "{{ lookup('env', 'GCP_PROJECT_ID') }}"
    env:     "{{ lookup('env', 'ENV') }}"

  # NB : les secrets (FT_CLIENT_ID/SECRET, DB_PASSWORD) sont créés et versionnés
  # par Terraform (cf. terraform/main.tf), plus par Ansible — évite les doublons.

  tasks:

    # ── Donner accès Cloud Run au Secret Manager (filet de sécurité) ──
    - name: Get Cloud Run Service Account
      command: >
        gcloud run services describe skillmap-backend-{{ env }}
        --region=europe-west1
        --format=value(spec.template.spec.serviceAccountName)
        --project={{ project }}
      register: sa_result
      ignore_errors: true

    - name: Grant Secret Manager access to Cloud Run SA
      command: >
        gcloud projects add-iam-policy-binding {{ project }}
        --member=serviceAccount:{{ sa_result.stdout }}
        --role=roles/secretmanager.secretAccessor
        --condition=None
      when: sa_result.rc == 0 and sa_result.stdout != ""

    # ── Smoke test ────────────────────────────────────────────
    - name: Get Cloud Run URL
      command: >
        gcloud run services describe skillmap-backend-{{ env }}
        --region=europe-west1
        --format=value(status.url)
        --project={{ project }}
      register: backend_url
      ignore_errors: true

    - name: Health Check
      uri:
        url: "{{ backend_url.stdout }}/actuator/health"
        status_code: 200
        timeout: 30
      register: health
      when: backend_url.rc == 0 and backend_url.stdout != ""
      retries: 5
      delay: 15

    - name: Afficher statut
      debug:
        msg: "✅ SkillMap {{ env }} — Health: {{ health.json.status | default('unknown') }}"
      when: health is defined and health.json is defined
