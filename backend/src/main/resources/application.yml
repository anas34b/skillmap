# ─────────────────────────────────────────
#  CONFIG COMMUNE (tous environnements)
# ─────────────────────────────────────────
spring:
  application:
    name: skillmap-backend

  jpa:
    hibernate:
      ddl-auto: validate        # Flyway gère les migrations
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
    show-sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration

  cache:
    type: redis

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 2000ms

# Actuator
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: when-authorized
  metrics:
    export:
      prometheus:
        enabled: true

# Scheduling collecteurs (toutes les heures)
skillmap:
  collector:
    cron: "0 0 * * * *"         # toutes les heures pile
    # Liste séparée par des virgules : @Value("${...}") la convertit en List<String>
    keywords: "Java,Spring Boot,Angular,React,Docker,Kubernetes,DevOps,Python,AWS,GCP,Azure,Terraform,Ansible,Jenkins,PostgreSQL,MongoDB,Redis,Kafka,Microservices,TypeScript"

---
# ─────────────────────────────────────────
#  PROFIL LOCAL (dev machine)
# ─────────────────────────────────────────
spring:
  config:
    activate:
      on-profile: local

  datasource:
    url: jdbc:postgresql://localhost:5432/skillmap
    username: skillmap
    password: skillmap
    driver-class-name: org.postgresql.Driver

  jpa:
    show-sql: true

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:9000   # Keycloak local ou mock

logging:
  level:
    com.skillmap: DEBUG
    org.springframework.security: DEBUG

---
# ─────────────────────────────────────────
#  PROFIL STAGING
# ─────────────────────────────────────────
spring:
  config:
    activate:
      on-profile: staging

  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASS}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 5
      minimum-idle: 2

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${JWT_ISSUER_URI}

logging:
  level:
    com.skillmap: INFO

---
# ─────────────────────────────────────────
#  PROFIL PROD
# ─────────────────────────────────────────
spring:
  config:
    activate:
      on-profile: prod

  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASS}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${JWT_ISSUER_URI}

logging:
  level:
    com.skillmap: WARN
    root: ERROR
