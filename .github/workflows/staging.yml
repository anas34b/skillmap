name: 🚀 Deploy Staging

on:
  push:
    branches: [develop]

env:
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  REGION: europe-west1
  IMAGE_TAG: ${{ github.sha }}
  SERVICE_NAME: skillmap-backend-staging

jobs:

  # ── 1. Tests ────────────────────────────────────────────────
  test:
    name: 🧪 Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: ☕ Setup Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: 🧪 Run Tests
        run: cd backend && ./mvnw test -q

      - name: 📊 Upload Coverage
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: backend/target/surefire-reports/

  # ── 2. Build Docker ──────────────────────────────────────────
  build:
    name: 🐳 Build & Push Docker
    needs: test
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.build.outputs.image }}
    steps:
      - uses: actions/checkout@v4

      - name: 🔑 Auth GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: 🐳 Configure Docker → Artifact Registry
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      - name: 🔨 Build & Push
        id: build
        run: |
          IMAGE="${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/skillmap/backend:${{ env.IMAGE_TAG }}"
          docker build -t $IMAGE ./backend
          docker push $IMAGE
          echo "image=$IMAGE" >> $GITHUB_OUTPUT
          echo "✅ Image pushed: $IMAGE"

  # ── 3. Terraform Staging ─────────────────────────────────────
  infra:
    name: 🏗️ Terraform Staging
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 🔑 Auth GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: 🏗️ Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: 🔧 Terraform Init
        working-directory: terraform
        run: terraform init
        env:
          GOOGLE_CREDENTIALS: ${{ secrets.GCP_SA_KEY }}

      - name: 📋 Terraform Plan
        working-directory: terraform
        run: |
          terraform plan \
            -var-file=staging.tfvars \
            -var="image_tag=${{ env.IMAGE_TAG }}"
        env:
          GOOGLE_CREDENTIALS: ${{ secrets.GCP_SA_KEY }}

      - name: 🚀 Terraform Apply
        working-directory: terraform
        run: |
          terraform apply -auto-approve \
            -var-file=staging.tfvars \
            -var="image_tag=${{ env.IMAGE_TAG }}"
        env:
          GOOGLE_CREDENTIALS: ${{ secrets.GCP_SA_KEY }}

  # ── 4. Ansible Config ────────────────────────────────────────
  configure:
    name: 🤖 Ansible Config
    needs: infra
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 🔑 Auth GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: 🤖 Setup Ansible
        run: pip install ansible google-auth --quiet

      - name: ▶️ Run Playbook
        run: ansible-playbook ansible/playbook.yml
        env:
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          ENV: staging
          FT_CLIENT_ID: ${{ secrets.FT_CLIENT_ID }}
          FT_CLIENT_SECRET: ${{ secrets.FT_CLIENT_SECRET }}

  # ── 5. Smoke Test ────────────────────────────────────────────
  smoke:
    name: 🔥 Smoke Test
    needs: configure
    runs-on: ubuntu-latest
    steps:
      - name: 🔑 Auth GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: 🩺 Health Check
        run: |
          URL=$(gcloud run services describe ${{ env.SERVICE_NAME }} \
            --region=${{ env.REGION }} \
            --format='value(status.url)')
          echo "Testing: $URL/actuator/health"
          for i in 1 2 3 4 5; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" $URL/actuator/health)
            if [ "$STATUS" = "200" ]; then
              echo "✅ Staging OK — Health check passed"
              exit 0
            fi
            echo "Attempt $i/5 — status $STATUS, waiting 15s..."
            sleep 15
          done
          echo "❌ Health check failed"
          exit 1

      - name: 📢 Notify Success
        if: success()
        run: |
          echo "✅ Staging deployed successfully"
          echo "Commit: ${{ github.sha }}"
          echo "Branch: ${{ github.ref_name }}"
